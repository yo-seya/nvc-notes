<script id="note-data" type="application/json">{"id": "nvc-reading-notes-20261029-v1", "updatedAt": 0, "title": "非暴力沟通 · 读书笔记", "subtitle": "把评判翻译为感受与需要，把模糊的希望变成可以回应的请求。", "source": "依据用户提供的《非暴力沟通》（马歇尔·卢森堡，十三章版本）EPUB整理。章节标题保留原书名称；要点为概括，职场案例为本笔记自拟，并非原书引文。EPUB页码随设备变化，因此采用章节定位。", "mission": "关注自己和他人的感受与需要，建立坦诚、同理的连接，让行动尽可能出于自愿。", "formula": "具体观察 ＋ 表达感受 ＋ 说明需要 ＋ 提出请求", "formulaNote": "四要素是觉察的方向，不是强制句式，也不是让对方答应的技巧。可以先倾听，也可以先表达；一次对话不必把四项全部说完。", "elements": [{"code": "O", "name": "观察", "question": "具体发生了什么？", "chapter": "第3章", "definition": "描述特定时间、情境中的可观察行为，区分事实与自己的评论，允许对方补充信息。", "contrast": "观察：这周有两次交付晚于约定时间。\n评论：你总是不负责任。", "self": "当我看到／听到……", "other": "你说的是……这件事吗？", "check": "能否指出具体事件？有没有把总是、从不或人格标签当作事实？", "exercise": "把一句带有评价的话改成具体行为描述。"}, {"code": "F", "name": "感受", "question": "我／你此刻有什么情绪？", "chapter": "第4章", "definition": "辨认并表达自己的情绪体验，例如紧张、失落、担心、轻松。情绪可以被承认，不必立刻压下去。", "contrast": "感受：我很失落，也有些担心。\n想法：我觉得你根本不在乎我。", "self": "我感到……", "other": "你现在是不是有些……？", "check": "是在说情绪，还是在推断别人对我做了什么？避免用纠正词汇的方式否定对方的体验。", "exercise": "用两个具体情绪词替换好、坏、没事或被针对。"}, {"code": "N", "name": "需要", "question": "什么对我／你很重要？", "chapter": "第5章", "definition": "辨认感受背后重视的东西，例如理解、尊重、自主、休息、安全、支持与连接。需要与满足它的某一种做法不同。", "contrast": "需要：我希望得到支持、保持连接。\n策略：你必须马上放下工作陪我。", "self": "因为我需要／看重……", "other": "因为你希望有更多……，对吗？", "check": "是否指定某个人必须做某件事？如果换一种做法也能满足它，更容易看清需要与策略的区别。", "exercise": "对一个坚持的做法问：这样做希望满足什么需要？再想两种不同策略。"}, {"code": "R", "name": "请求", "question": "希望对方具体做什么？", "chapter": "第6章", "definition": "提出正向、明确、可行、此刻能够回应的行动邀请。允许对方拒绝，并继续了解双方需要。", "contrast": "请求：你愿意在今天四点前告诉我目前的阻塞项吗？\n要求：你必须有责任心，不然就别做了。", "self": "你是否愿意……？", "other": "你希望我现在做的是……吗？", "check": "对方能否知道怎么做、何时做？如果他说不，我能否继续倾听，而不是指责或威胁？", "exercise": "把不要再拖了改成一个具体请求，也准备听取对方的困难。"}], "directions": [{"title": "诚实表达自己", "line": "我观察到什么 → 我有什么感受 → 我看重什么 → 我希望你具体做什么", "note": "为自己的表达和行动负责，清楚呈现自己；避免把期待藏在抱怨里。表达需要也可以坚定、有边界。"}, {"title": "同理倾听他人", "line": "你经历了什么 → 你有什么感受 → 你看重什么 → 你希望得到什么回应", "note": "带着好奇核实理解，给对方时间表达。猜测可以不准确；让对方纠正，比猜中更重要。"}], "topics": [{"title": "自我同理", "chapters": "第5、9、12章", "question": "在理解别人之前，我是否也听见了自己？", "steps": ["停一下，辨认自己的情绪与身体状态。", "把我真差、他太过分等判断，翻译为尚未满足的需要。", "选择此刻能照顾自己的行动；暂时离开、求助或稍后再谈也可以。"], "trap": "自我负责不等于自我归罪。别人的伤害仍由其承担责任。"}, {"title": "倾听与核实", "chapters": "第7、8章", "question": "我是在理解对方，还是急着给答案？", "steps": ["放慢反驳、分析、建议和安慰，让对方说完。", "复述感受与需要，并用对吗、我理解得准确吗来核实。", "留意对方还有什么想说；不把沉默或拒绝自动理解成敌意。"], "trap": "同理不等于赞同全部说法，也不要求解决对方所有问题。"}, {"title": "愤怒与刺激", "chapters": "第10章", "question": "愤怒背后，我真正重视的是什么？", "steps": ["停下并呼吸，先给自己时间。", "辨认触发愤怒的判断或应该，区分刺激与原因。", "连接尚未满足的需要，必要时先倾听，再表达感受与请求。"], "trap": "不压抑愤怒，也不借愤怒惩罚对方。需要是书中的重要理解视角；睡眠、疼痛等条件同样可能影响情绪。"}, {"title": "拒绝与协商", "chapters": "第5、6、8章", "question": "能否保留双方需要，调整具体策略？", "steps": ["将共同或不同的需要，与某个指定解决方案分开。", "听到不时，了解对方担心什么、希望保护什么。", "寻找双方愿意尝试的行动；也允许暂时谈不拢或停止对话。"], "trap": "理解拒绝不等于继续追问到对方答应；拒绝本身需要被尊重。"}, {"title": "保护与边界", "chapters": "第11章", "question": "这个行动是在防止伤害，还是为了让对方吃苦？", "steps": ["危险迫近或无法沟通时，优先保护自己和他人。", "区分保护性与惩罚性强制力，避免把羞辱当作教育。", "条件允许后，再说明边界、倾听与协商。"], "trap": "非暴力沟通不要求持续忍受侮辱、威胁或暴力，也不保证单方面沟通就能改变他人。"}, {"title": "感激与庆祝", "chapters": "第13章", "question": "对方的什么行动，让什么需要得到了满足？", "steps": ["说出对方具体做了什么。", "说明哪些需要因此得到满足。", "表达随之而来的感受，分享喜悦，不把赞美作为交换服从的手段。"], "trap": "感激不只是给人贴上优秀、懂事、好人的标签。"}], "chapters": [{"number": 1, "title": "让爱融入生活", "theme": "理解目的", "question": "沟通时，我的注意力放在哪里？", "points": ["非暴力沟通把注意力引向观察、感受、需要和请求。", "诚实表达与同理倾听是两个方向，可随情境交替。", "重点是连接与自愿回应，不是赢辩论或使用漂亮话。"], "trap": "把四要素当成让别人配合的口令。", "practice": "回想一次争执：当时我更想证明自己正确，还是想理解彼此？"}, {"number": 2, "title": "是什么蒙蔽了爱？", "theme": "识别阻碍", "question": "哪些表达让人更难听见彼此？", "points": ["道德评判、比较、推卸责任和强人所难，会遮蔽真实体验与需要。", "区分价值判断与对人的道德定性：我重视整洁，不必推出你很懒。", "觉察应该、不得不与奖惩语言，重新看见行动背后的选择和动机。"], "trap": "把你太暴力了、你不懂非暴力沟通变成新的指责。", "practice": "记下一句惯用的指责，尝试找出其中没有说出的需要。"}, {"number": 3, "title": "区分观察和评论", "theme": "观察 O", "question": "什么是发生的事，什么是我的解释？", "points": ["将具体行为与标签、推断区分开。", "说明时间和情境，少用没有依据的总是、从不。", "并非禁止评论，而是让评论与观察各自清楚。"], "trap": "声称自己绝对客观，以摆事实堵住对方补充信息的机会。", "practice": "将你开会从不听人说话改成最近一次会议中的具体行为。"}, {"number": 4, "title": "体会和表达感受", "theme": "感受 F", "question": "我能准确说出此刻的情绪吗？", "points": ["扩展情绪词汇，辨认紧张、失落、担心、感激等不同体验。", "区分情绪与对他人态度的推断，例如难过与被忽视。", "表达脆弱有助于别人理解自己，感受不需要被羞辱或否定。"], "trap": "忙着指出你这不是感受，却没有听见对方的痛苦。", "practice": "一天选三个时刻，记录感受和对应情境，不急着解释。"}, {"number": 5, "title": "感受的根源", "theme": "需要 N", "question": "这件事触动了什么需要、期待或理解？", "points": ["书中区分外在刺激与内在原因，将注意力带回需要、期待及对事件的理解。", "听到不中听的话时，可以自责、责人，也可以关注自己或他人的感受与需要。", "原书描述情感的奴隶、面目可憎、生活的主人三个阶段：从勉强为他人情绪负责，经由反抗，走向自我负责并关心他人。", "为自己的感受和行动负责，同时关心他人的需要，逐渐摆脱勉强牺牲或一味指责。"], "trap": "用你的感受与你自己有关逃避行为责任，或把所有情绪只归结为一种原因。", "practice": "写下我感到……，因为我看重……；再区分需要与指定策略。"}, {"number": 6, "title": "请求帮助", "theme": "请求 R", "question": "对方能知道我具体希望什么吗？", "points": ["用正向、具体、可行的语言说明希望发生的行动。", "可以请求对方复述、表达感受或说明是否愿意行动，核实信息有没有传达清楚。", "请求与要求的区别，会在对方拒绝后显现：是否仍尊重他并愿意协商。"], "trap": "说得很客气，却以责备、威胁或内疚惩罚拒绝。", "practice": "将你能不能认真一点改为具体动作、时间和可回应的问题。"}, {"number": 7, "title": "用全身心倾听", "theme": "同理他人", "question": "我能给对方充分表达的空间吗？", "points": ["暂时放下先入为主的判断，全心体会对方当下的体验。", "过早建议、说教、比较、解释或安慰，可能打断对方表达。", "可以探询式复述四要素；无法倾听时，先自我同理、表达需要或换个环境。"], "trap": "忙于追查原因、分析人格，却没有让对方感到被理解。", "practice": "下一次求助对话，先复述并核实理解，再问是否需要一起想办法。"}, {"number": 8, "title": "倾听的力量", "theme": "深化连接", "question": "面对脆弱、沉默与不，我还能听见什么？", "points": ["得到倾听，可能让人更有空间表达脆弱、理清体验与需要。", "关注拒绝和沉默背后的体验，但不把自己的猜测当作事实。", "持续关注对话中的变化，允许对方纠正、暂停或选择暂时不说。"], "trap": "把倾听当成一定能化解所有冲突、让别人敞开的保证。", "practice": "听到不时，先尊重拒绝；合适时再邀请对方讲讲顾虑。"}, {"number": 9, "title": "爱自己", "theme": "自我关怀", "question": "犯错后，我怎样对待自己？", "points": ["用对未满足需要的体会，替代羞辱式自我评价，从后悔中学习。", "自我宽恕是理解当时行为想满足的需要，同时看见造成的影响。", "尝试将不得不转成我选择……因为我重视……，审视行动动机。"], "trap": "把自我宽恕理解为不必承认错误，或强迫自己必须立即原谅。", "practice": "回看一个错误：现在遗憾什么？当时想保护什么？接下来如何修正？"}, {"number": 10, "title": "充分表达愤怒", "theme": "愤怒练习", "question": "怎样让愤怒传达真正的心声？", "points": ["先停下、呼吸，辨认脑中的判断，再连接尚未满足的需要。", "区分外在刺激与原因，以感受和需要表达心声。", "必要时先倾听，也给自己足够时间，不强迫当场完成高质量沟通。"], "trap": "一边套用句式，一边让对方觉得自己应当羞愧或受罚。", "practice": "将他怎么敢这样对我翻译成我很……，因为我非常看重……。"}, {"number": 11, "title": "运用强制力避免伤害", "theme": "保护边界", "question": "何时需要先保护，而来不及对话？", "points": ["危险迫近或无法沟通时，可以采取保护行动。", "保护性强制力着眼于避免伤害；惩罚性强制力着眼于让人受苦、悔改。", "惩罚可能把注意力转向不服从的代价，而遮蔽行为本身的意义。"], "trap": "把不设边界当作非暴力，或借保护之名羞辱、报复。", "practice": "区分阻止危险行为与事后羞辱，并写下一个清楚、可执行的边界。"}, {"number": 12, "title": "重获生活的热情", "theme": "内在连接", "question": "我真正想怎样生活？", "points": ["觉察内化的苛刻教诲和自我批判，倾听自己的需要。", "面对内在冲突，分别听见不同选择想照顾的需要，而非只问谁对谁错。", "通过清晰理解愿望并采取行动，逐渐找回自主感与生活的动力。"], "trap": "以为只要换种说法就能消除一切心理困扰，忽视现实条件和必要支持。", "practice": "写下我想休息与我想完成任务各自关心什么，再设计一个兼顾方案。"}, {"number": 13, "title": "表达感激", "theme": "庆祝满足", "question": "怎样让感谢传达真实的喜悦？", "points": ["说清有益的具体行为、得到满足的需要，以及产生的感受。", "区分分享感激与为了操控行为而给予赞扬。", "接收感谢时，也可以共同庆祝贡献，不必自大或贬低自己的付出。"], "trap": "只说你真棒，或把感谢变成暗示下次还必须帮助我的交换。", "practice": "用具体行为＋满足的需要＋感受，向一个人表达一次感谢。"}], "scenarios": [{"title": "同事说话很冲：从猜测走向倾听", "label": "自拟职场场景 · 倾听与核实", "trigger": "同事在群里连续问：还没好吗？不是说今天给吗？随即说：别再解释了，赶紧弄。", "observation": "我听见的是这些具体话语；说话很冲是我对语气和表达的感受与评价，需要与事实分开。", "hypotheses": "他会不会昨晚没睡好？今天是否有其他烦心事？是不是上线时间很急、担心影响别人？这些都只是理解的线索，不能替他确认。心情不好也是状态描述，还可以继续听听发生了什么。", "listen": "你现在是不是很着急，担心赶不上今天的上线？你愿意说说目前最紧迫的是什么吗？", "confirm": "如果他说：不是上线，是客户一直催我。可以回应：原来你正承受客户催促的压力，也希望我给你一个确定的进度，对吗？随后留出时间让他补充。", "respond": "确认后再谈行动：我现在卡在接口返回异常，预计还需要半小时。你愿意先让我发一条明确的进度说明给你，我们一起确认怎样回复客户吗？", "boundary": "如果表达持续带有侮辱：我愿意一起处理这个急事。刚才听到针对我的评价，我很难集中讨论。我希望我们围绕具体问题说；如果现在做不到，我会先暂停，稍后再谈。", "reflection": "理解他的背景，不等于替他说你就是没睡好，也不等于替他承担情绪或容忍伤害。倾听的目标是理解，不保证一定找到唯一根因。"}, {"title": "面对冲突：先核实事实，再选择回应", "label": "自拟职场场景 · 事实与回应", "trigger": "同事认为这次接口异常是我修改引入的，而我还没有核实。", "observation": "先看修改记录、报错时间、复现条件与接口约定，区分已知信息和推断。暂时把别人怎么看我放到一边。", "hypotheses": "可能是我的修改，也可能是接口理解不同、环境变化或多个条件共同触发。保持假设开放。", "listen": "你看到的异常具体发生在哪个环境、哪次请求里？你是不是担心它影响今天交付，希望尽快确认原因？", "confirm": "复述对方提供的事实和顾虑，让对方补充我遗漏的信息。", "respond": "如果是我的错误，明确承认并修正；如果表达未被准确理解，补充事实和上下文；信息不足时一起查证。", "boundary": "承认具体错误，不等于认可对整个人的贬低。可以同时承担责任与要求尊重。", "reflection": "过去为了减少冲突，我可能立即认错；现在尝试把事情与自我评价分开，依据事实选择回应。"}, {"title": "感谢同事：让贡献被具体看见", "label": "自拟职场场景", "trigger": "同事帮我补充了一个此前遗漏的边界测试。", "observation": "刚才你补充了空数据返回的测试，也指出了我没有考虑到的分支。", "hypotheses": "不需要推测他帮助我的动机，关注实际行动带来的影响。", "listen": "如果对方愿意，也听听他参与这件事的体验。", "confirm": "感谢可以简短，不必要求对方接受某种评价。", "respond": "这让我轻松了很多，因为我希望交付更可靠，也很珍惜有人一起检查遗漏。谢谢你。", "boundary": "不把今天的帮助变成下次必须继续帮我的义务。", "reflection": "感谢的核心是行为、得到满足的需要、感受，而不是给人打分。"}]}</script>
<script>
(() => {
'use strict';
const data=JSON.parse(document.getElementById('note-data').textContent);
let selectedCase=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const at=path=>path.split('.').reduce((v,k)=>v[k],data);
const e=(path,tag='p',cls='')=>`<${tag} class="${cls}" data-edit="${path}">${esc(at(path))}</${tag}>`;
const jump=(section,anchor='',label='展开')=>`<button type="button" data-go="${section}" data-anchor="${anchor}">${label}</button>`;
const header=(label,title,sub)=>`<div class="page-top"><div class="eyebrow muted">${label}</div><h2>${title}</h2><p>${sub}</p></div>`;
function render(){
document.getElementById('overview').innerHTML=`<div class="intro"><div class="eyebrow">NONVIOLENT COMMUNICATION</div>${e('title','h1')}${e('subtitle')}</div><div class="purpose"><span class="purpose-tag">核心目的</span>${e('mission')}</div><div class="section-caption"><h3>四要素：同一套方法</h3><span class="small muted">点击展开定义、区分与自检</span></div><div class="formula-grid">${data.elements.map((x,i)=>`<article class="element" data-tone="${x.code}"><span class="element-code">${x.code} / ${esc(x.chapter)}</span>${e(`elements.${i}.name`,'h3')}${e(`elements.${i}.question`,'p','question')}${jump('concepts',`element-${i}`,'查看要点 ↗')}</article>`).join('')}</div>${e('formula','p','formula-caption')}<div class="connector" aria-hidden="true"></div><div class="section-caption"><h3>两个方向：来回交换</h3></div><div class="direction-grid">${data.directions.map((x,i)=>`<article class="direction">${e(`directions.${i}.title`,'h3')}${e(`directions.${i}.line`,'p','sequence')}${e(`directions.${i}.note`,'p','small muted')}</article>`).join('')}</div>${e('formulaNote','p','callout small')}<div class="section-caption"><h3>六个实践课题</h3><span class="small muted">把公式放回真实生活</span></div><div class="topic-grid">${data.topics.map((x,i)=>`<article class="topic"><span class="chapter-tag">${esc(x.chapters)}</span>${e(`topics.${i}.title`,'h3')}${e(`topics.${i}.question`)}${jump('topics',`topic-${i}`,'展开练习 ↗')}</article>`).join('')}</div>${e('source','p','source-note')}`;
document.getElementById('concepts').innerHTML=header('FOUR COMPONENTS','四要素与四个区分','表达与倾听用同一组问题；先区分，再练习。')+data.elements.map((x,i)=>`<article class="block" id="element-${i}"><div class="block-header"><span class="round-code" style="background:var(--${x.code.toLowerCase()})">${x.code}</span><div>${e(`elements.${i}.name`,'h3')}<span class="small muted">${esc(x.chapter)}</span></div></div>${e(`elements.${i}.definition`)}<div class="label">关键区分</div>${e(`elements.${i}.contrast`,'div','contrast')}<div class="two-col"><div><span class="label">表达自己</span>${e(`elements.${i}.self`)}</div><div><span class="label">倾听他人</span>${e(`elements.${i}.other`)}</div></div><div class="callout"><h4>自检</h4>${e(`elements.${i}.check`)}</div><span class="label">一个小练习</span>${e(`elements.${i}.exercise`)}</article>`).join('')+`<div class="vocabulary"><article class="block"><h3>可以从这些感受词开始</h3><div class="word-cloud">${['担心','紧张','失落','沮丧','孤单','愤怒','困惑','疲惫','轻松','安心','喜悦','感激'].map(x=>`<span class="word">${x}</span>`).join('')}</div></article><article class="block"><h3>可以尝试辨认的需要</h3><div class="word-cloud">${['理解','尊重','自主','安全','休息','支持','连接','清晰','信任','公平','合作','意义'].map(x=>`<span class="word">${x}</span>`).join('')}</div></article></div>`;
document.getElementById('topics').innerHTML=header('PRACTICE THEMES','六个实践课题','始终回到感受、需要与自愿的回应；并非每次都要立即解决。')+`<div class="block topic-details">${data.topics.map((x,i)=>`<details id="topic-${i}" ${i===0?'open':''}><summary><span class="summary-title">${esc(x.title)}</span><span class="summary-meta">${esc(x.chapters)}</span></summary><div class="details-body">${e(`topics.${i}.title`,'h3')}${e(`topics.${i}.question`,'p','chapter-question')}<ol>${x.steps.map((s,j)=>e(`topics.${i}.steps.${j}`,'li')).join('')}</ol><div class="callout"><h4>容易误用的地方</h4>${e(`topics.${i}.trap`)}</div></div></details>`).join('')}</div>`;
document.getElementById('chapters').innerHTML=header('THIRTEEN CHAPTERS','回到原书的十三章','按原书顺序：理解目的 → 四要素 → 倾听 → 自我关怀与应用。')+`<div class="chapter-actions"><button type="button" id="expand-all">展开全部</button><button type="button" id="collapse-all">收起全部</button></div><div class="block chapter-details">${data.chapters.map((x,i)=>`<details ${i===0?'open':''}><summary><span class="chapter-number">${String(x.number).padStart(2,'0')}</span><span class="summary-title">${esc(x.title)}</span><span class="summary-meta">${esc(x.theme)}</span></summary><div class="details-body">${e(`chapters.${i}.title`,'h3')}${e(`chapters.${i}.question`,'p','chapter-question')}<ul>${x.points.map((p,j)=>e(`chapters.${i}.points.${j}`,'li')).join('')}</ul><div class="callout"><h4>容易误用的地方</h4>${e(`chapters.${i}.trap`)}</div><span class="label">练习卡</span>${e(`chapters.${i}.practice`)}</div></details>`).join('')}</div>${e('source','p','source-note')}`;
document.getElementById('cases').innerHTML=header('SCENARIOS','先听见，再回应','自拟职场案例。猜测是线索，理解需要向当事人核实。')+`<div class="case-select">${data.scenarios.map((x,i)=>`<button type="button" data-case="${i}" aria-pressed="${i===selectedCase}">${['同事说话很冲','面对冲突','表达感谢'][i]}</button>`).join('')}</div><article class="block" id="scenario"></article>`;
renderCase();
}
function renderCase(){const i=selectedCase,x=data.scenarios[i];document.getElementById('scenario').innerHTML=e(`scenarios.${i}.title`,'h3')+e(`scenarios.${i}.label`,'p','small muted')+[['trigger','具体情境'],['observation','① 区分事实'],['hypotheses','② 保留假设'],['listen','③ 倾听邀请'],['confirm','④ 核实理解'],['respond','⑤ 回应与协商'],['boundary','⑥ 照顾边界'],['reflection','复盘提醒']].map(([key,label])=>`<div class="scenario-step"><span class="step-name">${label}</span>${e(`scenarios.${i}.${key}`,'div','step-value')}</div>`).join('');}
function show(id,anchor=''){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-nav]').forEach(x=>{if(x.dataset.nav===id)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});if(anchor){const target=document.getElementById(anchor);if(target?.tagName==='DETAILS')target.open=true;setTimeout(()=>target?.scrollIntoView({block:'start',behavior:'auto'}),0);}else window.scrollTo({top:0,behavior:'auto'});}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.nav)show(b.dataset.nav);if(b.dataset.go)show(b.dataset.go,b.dataset.anchor);if(b.dataset.case!==undefined){selectedCase=Number(b.dataset.case);document.querySelectorAll('[data-case]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.case)===selectedCase)));renderCase();}if(b.id==='expand-all')document.querySelectorAll('#chapters details').forEach(d=>d.open=true);if(b.id==='collapse-all')document.querySelectorAll('#chapters details').forEach(d=>d.open=false);});
render();
})();
</script>
</body>
</html>
